server {
  listen 8080 default_server;
  listen [::]:8080 default_server;

  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # Gzip — Brotli requires a custom build, so we keep this minimal.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    application/manifest+json;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Hashed assets — cache forever
  location /assets/ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Static media
  location ~* \.(?:svg|png|jpg|jpeg|webp|avif|ico|woff2)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Sitemap and robots — short cache
  location = /robots.txt { expires 1h; }
  location ~ ^/sitemap.*\.xml$ { expires 1h; }

  # HTML — always revalidate so deploys roll out instantly
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/index.html $uri.html =404;
  }

  # Custom 404
  error_page 404 /404.html;
  location = /404.html { internal; }
}
